# Built from template located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Python.gitlab-ci.yml

variables:
    # Change pip's cache directory to be inside the project directory.
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

default:
    cache:
        paths:
            - .cache/pip

    before_script:
        - apt-get update -yq && apt-get install -yq curl ffmpeg pulseaudio-utils
        - PIP_BREAK_SYSTEM_PACKAGES=1 python -m pip install psutil libpulse h11
        - useradd -m -s /bin/bash padlna
        - /bin/find $CI_PROJECT_DIR -exec chown padlna:padlna {} \;
        - su padlna -c "python --version"

.pulseaudio: &pulseaudio
    - apt-get update -yq && apt-get install -yq pulseaudio
    - su padlna -c "pulseaudio --verbose --daemonize=yes"
    - sleep 1
    - su padlna -c "pactl info"

.pipewire: &pipewire
    - apt-get update -yq && apt-get install -yq xvfb
      pipewire wireplumber pipewire-pulse
    - |
      export 'XDG_RUNTIME_DIR=/tmp'
      export 'DISPLAY=:0.0'
      Xvfb -screen $DISPLAY 1920x1080x24 &
      pipewire &
      pipewire-pulse &
      wireplumber &

# Install upmpdcli and mpd.
.upmpdcli-mpd: &upmpdcli-mpd
    - mkdir -p /usr/share/keyrings
    - curl --output-dir /usr/share/keyrings
      -O https://www.lesbonscomptes.com/pages/lesbonscomptes.gpg
    - curl --output-dir /etc/apt/sources.list.d/
      -O https://www.lesbonscomptes.com/upmpdcli/pages/upmpdcli-trixie.sources
    - apt-get update -yq && apt-get install -yq upmpdcli
    - apt-get update -yq && apt-get install -yq mpd

.unittest-scripts: &unittest-scripts
    - su padlna -c "python -m unittest --verbose --failfast"

.coverage-scripts: &coverage-scripts
    - PIP_BREAK_SYSTEM_PACKAGES=1 python -m pip install coverage
    - su padlna -c "python -m coverage run --include="./*" -m unittest"
    - su padlna -c "python -m coverage report --show-missing"

pipwire-tests:
    image: python:3.14
    stage: test
    script:
        - *pipewire
        - sleep 1
        - pactl info
        - python -m unittest --verbose --failfast

py311:
    image: python:3.11
    stage: test
    script:
        - *pulseaudio
        - *unittest-scripts

py312:
    image: python:3.12
    stage: test
    script:
        - *pulseaudio
        - *unittest-scripts

py313:
    image: python:3.13
    stage: test
    script:
        - *pulseaudio
        - *unittest-scripts

py314:
    image: python:3.14
    stage: test
    script:
# Skip upmpdcli (downloading is unreliable)
#       - *upmpdcli-mpd
        - *pulseaudio
        - *unittest-scripts
        - *coverage-scripts
    coverage: '/TOTAL.* (100\%|\d?\d\%)$/'
