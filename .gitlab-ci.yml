# Built from template located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Python.gitlab-ci.yml

variables:
    PIP_BREAK_SYSTEM_PACKAGES: "1"
    PIP_ROOT_USER_ACTION: "ignore"

    # Change pip's cache directory to be inside the project directory.
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

default:
    cache:
        paths:
            - .cache/pip

.init-script: &init-script
    - apt-get update -yq && apt-get install -yq curl ffmpeg pulseaudio-utils
    - useradd -m -s /bin/bash padlna
    - /bin/find $CI_PROJECT_DIR -path $CI_PROJECT_DIR/.cache -prune -o
      -exec chown padlna:padlna {} \;
    - chown root:root $CI_PROJECT_DIR
    - python -m pip install psutil libpulse h11
    - su padlna -c "python --version"

.pulseaudio: &pulseaudio
    - apt-get update -yq && apt-get install -yq pulseaudio
    - su padlna -c "pulseaudio --verbose --daemonize=yes"
    - sleep 1
    - su padlna -c "pactl info"

.unittest-scripts: &unittest-scripts
    - su padlna -c "python -m unittest --verbose --failfast"

py311:
    image: python:3.11
    stage: test
    script:
        - *init-script
        - *pulseaudio
        - *unittest-scripts

py312:
    image: python:3.12
    stage: test
    script:
        - *init-script
        - *pulseaudio
        - *unittest-scripts

py314:
    image: python:3.14
    stage: test
    script:
        - *init-script
        - *pulseaudio
        - *unittest-scripts

# Image based on debian:trixie including Python 3.13.
# Running pipewire and streaming tracks on upmpdcli/mpd.
pipewire-upmpdcli:
    image: $CI_REGISTRY_IMAGE/pipewire-upmpdcli:latest
    stage: test
    script:
        - cd $CI_PROJECT_DIR
        - source ./tools/docker-pipewire.sh
    rules:
      - if: $CI_COMMIT_BRANCH == "master"
        allow_failure: false
      - if: $CI_COMMIT_BRANCH != "master"
        allow_failure: true   # Failures allowed on feature branches
    coverage: '/TOTAL.* (100\%|\d?\d\%)$/'
